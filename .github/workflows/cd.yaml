name: nodejs cd

on:
  workflow_run:
    workflows: ["nodejs CI"]
    types:
      - completed

jobs:
  deploy:
    if:  github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu:latest

    steps:
     - name: checkout
       uses: actions/checkout@v4

     - name: Install sshpass
       run: sudo apt-get update && sudo apt-get install -y sshpass

     - name: Setup ssh
       run: | 
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull heyrohhh/makhan:latest
          docker stop makhan || true
          docker rm makhan || true
          docker run -d --name makhan -p 3000:3000 heyrohhh/makhan:latest
         


        
