name: nodejs CI

on: 
 push:
  branches:
    - dev
 pull_request:
    branches:
      - dev

#jobs 

jobs:
  build:
   name: build webpage
   runs-on: ubuntu-latest

  strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

  steps:
   - name: checkout repo
     uses: actions/checkout@v4
   
   - name: setup nodejs
     uses: actions/setup-node@v4
     with:
       version: ${{ matrix.node-version }}
       cache: npm
   - run : |
       npm-ci
       npm run lint 
       npm run build --if-present

   - name: Docker Hub Login
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

   - name: docker image build
     uses: actions/checkout@v4
     run: docker build . --file ../Dockerfile --tag heyrohhh/makhan:${{ github.run_id }}
   
   - name: sbom 
     uses: anchore/sbom-action@v0
     with:
      image: makhan:${{ github.run_id }}
      format: cyclonedx-json
      output-fle: sbom_${date +%s}.json 
   
   - name: trivy scan of image
     uses: aquasecurity/trivy-action@master
     with:
       image-ref: makhan:${{ github.run_id }}
       format: json
       output: trivy_report_${date +%s0}.json
       exit-code: '1'
       ignore-unfixed: true
       vuln-type: 'os,library'
       severity: 'CRITICAL,HIGH'
   - name: Upload Security Reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
          name: makhan-security-reports
          path: |
            sbom.json
            trivy-report.json
          retention-days: 30
   - name: docker image push
     uses: actions/checkout@v4
     run: docker push heyrohhh/makhan:${{ github.run_id }}


