
name: nodejs CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run build --if-present

      - name: Build Docker Image
        run: docker build -t heyrohhh/makhan:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: heyrohhh/makhan:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: heyrohhh/makhan:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makhan-security-reports-${{ matrix.node-version }}
          path: |
            sbom.json
            trivy-report.json
          retention-days: 30

      - name: Docker Hub Login
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push heyrohhh/makhan:${{ github.sha }}
